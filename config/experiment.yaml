# Single source of truth for the experiment. Frozen at Gate G2 (git tag config-frozen-v1).
# After the freeze, change nothing here without an approved message in COLLAB.md.

study_id: vlm-modality-v1
seed: 630

items:
  pilot_per_content: 30        # disjoint from the main sample
  main_per_content: 500        # may be lowered to 300 at Gate G2 if the pilot shows it is needed

content_types:
  code:
    source: "CRUXEval, HF cruxeval-org/cruxeval, split test (800 items)"
    task: output_prediction    # given f and an input, predict f(input)
  math:
    source: "GSM8K, HF openai/gsm8k, config main, split test (1,319 items)"
    task: word_problem
    wrap_chars: 80             # problem text is word-wrapped once; the SAME wrapped string is used in text and image
  table:
    source: "WikiTableQuestions, test split (pristine-unseen-tables). HF stanfordnlp/wikitablequestions, or github ppasupat/WikiTableQuestions if the HF loader fails"
    task: table_qa

# Canonical content string = everything item-specific (code + call, word problem, table + question).
# Condition A puts it in the prompt as text; B and C render it to an image. The instruction is always text.
conditions:
  A_text: "content as text"
  B_image: "content as image, answer directly"
  C_image_transcribe: "content as image, transcribe first, then answer (same call)"

exclusions:                    # applied BEFORE sampling; every exclusion is logged with its reason
  max_line_chars: 160
  max_lines: 60
  table_max_rows: 40
  drop_if_render_fails: true
  drop_if_over_context: true   # checked per model at run time; logged, not re-sampled

render:
  font: "DejaVu Sans Mono"
  font_size_px: 20
  line_height: 1.3
  padding_px: 24
  background: "#FFFFFF"
  foreground: "#000000"
  wrap: false                  # never wrap at render time; math is pre-wrapped in the content string
  format: PNG
  dpi_note: "no rescaling; image size = text extent + padding"

decoding:
  temperature: 0
  top_p: 1.0
  max_new_tokens: 2048
  n: 1

answer_format:
  marker: "Final answer:"      # the LAST line starting with this marker is parsed
  unparseable_counts_as: incorrect   # pre-registered; sensitivity analysis excludes them

transcription:
  correct_if: "exact match after whitespace normalization"   # primary
  sensitivity_cer_threshold: 0.02

models:                        # proposal; the runner checks availability at T00/T07, final list fixed at Gate G2
  local:
    - {id: "Qwen/Qwen2.5-VL-3B-Instruct",  family: qwen,   access: open, params_b: 3}
    - {id: "Qwen/Qwen2.5-VL-7B-Instruct",  family: qwen,   access: open, params_b: 7}
    - {id: "Qwen/Qwen2.5-VL-32B-Instruct", family: qwen,   access: open, params_b: 32}
    - {id: "Qwen/Qwen2.5-VL-72B-Instruct", family: qwen,   access: open, params_b: 72, optional: true}
    - {id: "google/gemma-3-12b-it",        family: gemma,  access: open, params_b: 12}
    - {id: "google/gemma-3-27b-it",        family: gemma,  access: open, params_b: 27}
    - {id: "OpenGVLab/InternVL3-8B",       family: intern, access: open, params_b: 8}
    - {id: "deepseek-ai/deepseek-vl2",     family: deepseek, access: open, optional: true}
  api:                         # only if the owner approves keys and budget (task T09)
    - {provider: openai,    id: "TBD at G2", access: proprietary}
    - {provider: google,    id: "TBD at G2", access: proprietary}
    - {provider: anthropic, id: "TBD at G2", access: proprietary}
